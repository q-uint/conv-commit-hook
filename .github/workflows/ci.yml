on: [push]
jobs:
  license-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go install github.com/q-uint/go-license-header@v0.1.1
      - run: go-license-header check -r -c "Quint Daenen" -n conv-commit-hook
